# nginx.conf  ->  /etc/nginx/sandy-bank.d/flashcards.conf
#
# Installed by ./deploy.sh -n, which calls deploy/install-fragment.sh:
# scp the file, run `nginx -t` on the whole config, reload — and if
# validation fails, restore the previous fragment (or remove it) and
# reload, so a broken fragment here can never take the shared proxy down.
#
# Bare `location` blocks only — no `server {}` wrapper. They are
# `include`d into the shared server block on the pi
# (/etc/nginx/sites-available/sandy-bank.conf).
#
# This app owns exactly one top-level path prefix: /flashcards/. nginx
# resolves prefix locations by longest match, not file order, so this
# fragment composes with every other app's regardless of install order.

# The OpenAPI spec, served by the binary. The shared Swagger UI at
# /docs/ loads it from /flashcards/openapi.yaml (see the fleet's
# components/swagger-ui/swagger-initializer.js), which is OUTSIDE the
# /flashcards/api/ prefix below, so it needs its own route to the
# backend. Exact match (`=`), not a regex — it matches this one URI and
# nothing else, so order-independent composition is preserved.
location = /flashcards/openapi.yaml {
    proxy_pass http://127.0.0.1:8081/openapi.yaml;
}

# The API. Trailing slash on both sides strips the /flashcards/api/
# prefix before proxying, so the binary keeps its own routes (GET
# /healthz, GET /cards, POST /cards, GET /cards/{id}) and never knows it
# is mounted under a prefix. The client calls
# http://<pi>/flashcards/api/cards. The binary stays bound to 127.0.0.1
# (see server/pi-flashcards-server.service) so nginx is the only way in.
location /flashcards/api/ {
    proxy_pass http://127.0.0.1:8081/;
}

# Static single-page app. `alias`, not `root`, because the files on disk
# are not under a /flashcards/ directory. try_files falls back to
# index.html so client-side routes survive a hard refresh — this alias +
# try_files combo is the fiddly bit; retest a deep-link reload after any
# nginx upgrade.
location /flashcards/ {
    alias /var/www/sandy-bank/flashcards/;
    try_files $uri $uri/ /flashcards/index.html;
}

# A bare, slashless /flashcards would otherwise fall through to the
# shared `location /`. Redirect it to the app root.
location = /flashcards {
    return 301 /flashcards/;
}
