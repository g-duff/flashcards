[package]
name = "pi_flashcards_server"      # underscores — deploy.sh reads this to name the binary
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
# No `clock` feature: the functional core takes `now` as a parameter and
# must not read a wall clock. The shell adds `clock` when it needs system time.
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
