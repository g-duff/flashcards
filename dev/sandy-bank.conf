# Vendored copy of sandy-bank/components/nginx/sandy-bank.conf — the fleet's
# shared nginx "shell". Used only by dev/Containerfile to reproduce the pi's
# reverse proxy locally. Re-sync if the fleet ever changes the shell (rare);
# it changes only for genuinely fleet-wide concerns (TLS, a shared header).
#
# On the pi this is a sites-available/sites-enabled site; here it is dropped
# into the stock nginx image's /etc/nginx/conf.d/, which the image already
# includes inside its http{} block. Same effect: one server{} on :80 that
# includes one routing fragment per app from /etc/nginx/sandy-bank.d/.

server {
    listen 80 default_server;
    server_name _;

    # Per-app routing fragments, one file each. nginx matches prefix
    # `location`s by longest match, not file order, so glob order is
    # irrelevant as long as every app keeps to a unique top-level path
    # prefix. dev/Containerfile drops this app's real nginx.conf in here.
    include /etc/nginx/sandy-bank.d/*.conf;

    # Anything no app fragment claims: a static holding page.
    location / {
        root /var/www/default;
        try_files $uri $uri/ =404;
    }
}
